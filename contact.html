<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Learning by Doing</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body class="contact-page">
    <header id="site-header"></header>

    <main>
        <p class="eyebrow">Say hello</p>
        <h1>Contact Me</h1>
        <p class="page-intro">
            Have a question? Fill out the form to prepare an email in your email app.
        </p>

        <form id="contact-form" action="mailto:X20250020@stu.hibiuh.edu.cn" method="post" enctype="text/plain">
            <p>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required>
            </p>

            <p>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            </p>

            <p>
                <label for="message">Message</label>
            </p>

            <textarea id="message" name="message" rows="6" placeholder="Write your message here" required></textarea>

            <p>
                <button type="submit">Send message</button>
            </p>
            <p class="form-note" id="contact-status" role="status">Your email app will open so you can review and send the message.</p>
        </form>
    </main>

    <footer id="site-footer"></footer>
    <script src="parts.js"></script>
    <script src="contact.js"></script>
</body>

</html>
